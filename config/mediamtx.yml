###############################################
# MediaMTX base configuration
#
# Static paths are defined below: "demo" (a synthetic test pattern) and
# "virtualcam" (loops a local video file from ./media). Both let you verify the
# server end-to-end over RTSP/WebRTC/HLS without real hardware.
###############################################

# ----- Global -----
logLevel: info

# ----- Control API -----
api: yes
apiAddress: :9997

# ----- RTSP (programmatic consumers: OpenCV / AI-ML) -----
rtsp: yes
rtspAddress: :8554

# ----- WebRTC (browser playback) -----
webrtc: yes
webrtcAddress: :8889
# Allow the browser to negotiate over the local network during development.
webrtcAdditionalHosts: [localhost]

# ----- HLS (fallback / wide compatibility) -----
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no

# ----- Paths -----
paths:
  # Synthetic test pattern + tone. Started on demand when a client connects;
  # lets us confirm RTSP/WebRTC/HLS all work before wiring real cameras.
  demo:
    runOnDemand: >
      ffmpeg -re -f lavfi -i testsrc=size=1280x720:rate=25
      -f lavfi -i sine=frequency=1000:sample_rate=48000
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p
      -c:a aac -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s

  # Virtual camera: loops a local video file forever, so the whole pipeline can
  # be exercised without real hardware. The file lives in ./media (mounted at
  # /media by docker-compose) and is selected with the VIRTUALCAM_FILE env var
  # (default sample.mp4). Started on demand and re-served over RTSP/WebRTC/HLS,
  # exactly like a real camera. Generate a test clip with:
  #   utils/virtual_rtsp_camera.sh --make-sample
  virtualcam:
    runOnDemand: >
      ffmpeg -re -stream_loop -1 -i /media/${VIRTUALCAM_FILE}
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50
      -c:a aac -ar 48000 -b:a 128k
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s

  # Multi-camera demo: every file in ./media automatically becomes its own
  # looping stream — no per-file config needed. The path name is the filename
  # (with extension), matched by the regex below and captured as $G1:
  #   media/office.mp4  ->  rtsp://<host>:8554/media/office.mp4
  #                         http://<host>:8889/media/office.mp4  (WebRTC)
  #                         http://<host>:8888/media/office.mp4  (HLS)
  # Each stream starts on demand when the first client connects and stops
  # shortly after the last one leaves, so idle clips cost no CPU.
  "~^media/(.+)$":
    runOnDemand: >
      ffmpeg -re -stream_loop -1 -i /media/$G1
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50
      -c:a aac -ar 48000 -b:a 128k
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s

  # USB webcam → RTSP/WebRTC/HLS. Requires a camera at /dev/video0 passed into
  # the container (uncomment the `devices:` block in docker-compose.yml). Started
  # on demand and transcoded to H.264 for browser compatibility. If your camera
  # streams MJPEG, add `-input_format mjpeg` before `-i`; for a different node,
  # change /dev/video0 here AND in the compose `devices:` mapping.
  usbcam:
    runOnDemand: >
      ffmpeg -f v4l2 -i /dev/video0
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
