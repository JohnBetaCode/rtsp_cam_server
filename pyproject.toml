[project]
name = "rtsp-cam-server"
version = "0.1.0"
description = "Camera aggregation hub: ingest USB/RTSP cameras and serve them over RTSP/WebRTC/HLS for browsers and downstream AI/ML pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
client = [
    "opencv-python>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtsp_cam_server"]
